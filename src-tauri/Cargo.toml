[package]
name = "wuwaidmobile"
version = "1.1.0"
description = "WuwaIDMobile, a Tauri desktop and Android application."
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wuwaidmobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
repak = { git = "https://git.xeondev.com/ReversedRoomsMisc/repak.git", rev = "76cf7c4173340686acd6f6764578a8ffa273d04b", default-features = false, features = ["wuthering-waves", "compression"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

# Debug APKs retain runtime checks, backtraces and module/line information, not full variable/type data.
[profile.dev]
opt-level = 2
debug = 1

# Favor smaller release code without disabling loop vectorization (`z` does).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
