[package]
name = "wuwaid-mobile"
version = "0.3.4"
description = "WuwaID Mobile launcher"
authors = ["WuwaID Mobile contributors"]
edition = "2021"

[lib]
name = "wuwaid_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
